
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小明的生日派对邀请函</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            margin: 0;
        }
        .invitation {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: #FF6B9D;
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 32px;
        }
        .header p {
            margin: 10px 0 0 0;
            font-size: 18px;
            opacity: 0.9;
        }
        .content {
            padding: 40px 30px;
        }
        .greeting {
            font-size: 18px;
            margin-bottom: 20px;
            color: #333;
        }
        .details {
            background: #f8f9fa;
            border-left: 4px solid #FF6B9D;
            padding: 20px;
            margin: 20px 0;
        }
        .detail-item {
            margin: 12px 0;
            display: flex;
        }
        .detail-label {
            font-weight: bold;
            color: #FF6B9D;
            min-width: 80px;
        }
        .detail-value {
            color: #333;
        }
        .footer {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            color: #666;
        }
        .emoji {
            font-size: 50px;
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="invitation">
        <div class="header">
            <h1>🎉 生日派对邀请函 🎉</h1>
            <p>小明 的 8 岁生日派对</p>
        </div>
        <div class="content">
            <div class="greeting">
                亲爱的 <strong>李四</strong>，
            </div>
            <p>我们诚挚地邀请您参加 <strong>小明</strong> 的 <strong>8</strong> 岁生日派对！</p>

            <div class="emoji">🎂🎈🎁</div>

            <div class="details">
                <h3 style="margin-top:0; color: #FF6B9D;">派对详情</h3>
                <div class="detail-item">
                    <span class="detail-label">小寿星：</span>
                    <span class="detail-value">小明</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">年龄：</span>
                    <span class="detail-value">8 岁</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">日期：</span>
                    <span class="detail-value">2025-11-15</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">时间：</span>
                    <span class="detail-value">14:00</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">地点：</span>
                    <span class="detail-value">欢乐儿童乐园</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">地址：</span>
                    <span class="detail-value">北京市朝阳区欢乐街123号</span>
                </div>

                <div class="detail-item">
                    <span class="detail-label">主题：</span>
                    <span class="detail-value">超级英雄</span>
                </div>

            </div>

            <p style="margin-top: 30px; text-align: center; font-size: 16px; color: #666;">
                期待您的光临，让我们一起为 小明 庆祝这个特别的日子！<br>
                请回复确认是否能够参加。
            </p>
        </div>
        <div class="footer">
            联系方式：13800138002
        </div>
    </div>
</body>
</html>
